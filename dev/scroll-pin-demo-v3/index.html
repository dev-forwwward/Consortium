<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll Pin Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <section class="section section-1">
    <h2 class="title">title 1</h2>
    <h2 class="title">title 2</h2>
    <h2 class="title">title 3</h2>
  </section>

  <section class="section section-2" id="mapSection">
    <div id="canvas-wrap">
      <canvas id="scene"></canvas>
      <div id="hint">drag · orbit — space/middle-drag · pan — scroll · zoom<br>hover a structure for details · click to
        open</div>
      <div id="tooltip">
        <div class="loc"></div>
        <div class="count"></div>
      </div>
    </div>
    <div class="map-button-toggles">
      <div class="map-button-toggles-inner">
        <button class="close-map-btn" id="closeMap" aria-label="Close map"><span aria-hidden="true">×</span> Close
          map</button>
        <button class="open-map-btn" id="openMap" aria-label="Explore map"> Explore map</button>
      </div>
    </div>
  </section>

  <section class="section section-3">
    <h2 class="title">title 4</h2>
    <h2 class="title">title 5</h2>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"
    integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"
    integrity="sha384-Z3REaz79l2IaAZqJsSABtTbhjgOUYyV3p90XNnAPCSHg3EMTz1fouunq9WZRtj3d"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"
    integrity="sha384-B2WBjDzEjJpYvhmi2UyEn7rektqkf5suS6sNoyyrf0EBAwBHdkiXxIlU0V5Ru2ed"
    crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="map.js"></script>
  <script src="script.js"></script>
</body>

</html>
